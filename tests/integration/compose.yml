# Throwaway servers for Framework's integration tests, shared by the R
# package, framework-py, and fw. The R repository holds the canonical copy;
# the others copy it with their asset sync. Every credential here is a
# test-only value for a local container and is never used anywhere real.
#
#   docker compose -f tests/integration/compose.yml up -d --wait
#   docker compose -f tests/integration/compose.yml down -v
#
# Ports bind to 127.0.0.1 and avoid the usual defaults, so they never collide
# with real local servers. Tests read them from FW_TEST_* variables (see
# README.md), fall back to the values below, and skip when a port is closed.

name: framework-test

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: framework_test
      POSTGRES_USER: framework
      POSTGRES_PASSWORD: framework-test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framework -d framework_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: framework_test
      MYSQL_USER: framework
      MYSQL_PASSWORD: framework-test
      MYSQL_ROOT_PASSWORD: framework-test-root
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uframework", "-pframework-test"]
      interval: 3s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: framework_test
      MARIADB_USER: framework
      MARIADB_PASSWORD: framework-test
      MARIADB_ROOT_PASSWORD: framework-test-root
    ports:
      - "127.0.0.1:53307:3306"
    volumes:
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Microsoft publishes SQL Server for amd64 only. On Apple Silicon it runs
  # under emulation (Docker Desktop's Rosetta or OrbStack).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Framework-test-1
    ports:
      - "127.0.0.1:51433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Framework-test-1' -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # SQL Server has no init folder, so this one-shot container loads the seed
  # script once the server is healthy. It skips when framework_test already
  # exists, so running `up` again never wipes a database another test run is
  # using. `down` resets everything.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sqlserver/init.sql:/init.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P Framework-test-1 -b"
        if $$SQLCMD -h -1 -Q "SET NOCOUNT ON; SELECT DB_ID('framework_test')" | grep -q '[0-9]'; then
          echo "framework_test already exists; leaving it alone"
        else
          $$SQLCMD -i /init.sql
        fi
    restart: "no"

  # S3: MinIO no longer publishes images, so this is SeaweedFS's S3 gateway.
  # With no identities configured it accepts any key; tests use
  # framework / framework-test.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:58333:8333"
